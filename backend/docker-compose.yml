version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: recorddb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - my_network
  app:
    image: record-app
    depends_on:
      - mysql
    networks:
      - my_network

networks:
  my_network:
    driver: bridge
